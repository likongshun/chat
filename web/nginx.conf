server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $collector_upstream collector:9090;

    location = /api/metrics {
        proxy_pass http://$collector_upstream/metrics;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location = /api/healthz {
        proxy_pass http://$collector_upstream/healthz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location = /api/readyz {
        proxy_pass http://$collector_upstream/readyz;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location = /api/v1/devices {
        proxy_pass http://$collector_upstream/api/v1/devices;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
    location /api/v1/ {
        proxy_pass http://$collector_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}