server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; charset utf-8; location /api/ { proxy_pass http://collector:9090/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_connect_timeout 2s; proxy_read_timeout 5s; } location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; } location /assets/ { expires 1h; add_header Cache-Control "public"; } }