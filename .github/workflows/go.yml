name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve module dependencies
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build collector container image
        run: docker build --tag modbus-collector:ci .
      - name: Start MQTT and InfluxDB integration services
        run: docker compose up -d --wait mqtt influxdb
      - name: Test MQTT QoS 1 and InfluxDB v2 delivery
        run: |
          INFLUX_TEST_TOKEN="$(sed -n 's/^INFLUXDB_ADMIN_TOKEN=//p' .env)" \
          MQTT_TEST_BROKER=tcp://127.0.0.1:1883 \
          INFLUX_TEST_URL=http://127.0.0.1:8086 \
          INFLUX_TEST_ORG=modbus \
          INFLUX_TEST_BUCKET=telemetry \
          go test ./internal/pipeline -run 'TestMQTTSinkQoS1Integration|TestInfluxSinkIntegration' -count=1
      - name: Stop integration services
        if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi
