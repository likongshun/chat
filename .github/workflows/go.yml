name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Resolve module dependencies
        run: go mod tidy
      - name: Format Go sources
        run: gofmt -w .
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: WAL backlog snapshot and recovery benchmark
        run: go test ./internal/reliability/wal -run '^$' -bench '^BenchmarkWALBacklogSnapshotRecovery$' -benchtime=30s -count=1
      - name: Sustained pending backlog checkpoint and restart soak
        run: WAL_SOAK_DURATION=15s go test -v ./internal/reliability/wal -run '^TestWALSteadyStateBacklogSoak$' -count=1
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Build collector container image
        run: docker build --tag modbus-collector:ci .
      - name: Prepare bounded ext4 filesystem for real WAL ENOSPC test
        run: |
          sudo truncate -s 128M /tmp/modbus-wal-fs.img
          sudo mkfs.ext4 -F -m 0 /tmp/modbus-wal-fs.img
          sudo mkdir -p /mnt/modbus-wal-fs
          sudo mount -o loop /tmp/modbus-wal-fs.img /mnt/modbus-wal-fs
          sudo chown "$(id -u):$(id -g)" /mnt/modbus-wal-fs
          echo "WAL_REAL_DISK_FULL_DIR=/mnt/modbus-wal-fs" >> "$GITHUB_ENV"
      - name: Test real filesystem-full ACK reserve behavior
        run: go test ./internal/reliability/wal -run '^TestWALRealFilesystemFullACKReserve$' -count=1
      - name: Unmount bounded WAL fault-test filesystem
        if: always()
        run: sudo umount /mnt/modbus-wal-fs || true
      - name: Start PostgreSQL, MQTT and InfluxDB integration services
        run: docker compose up -d --wait postgres mqtt influxdb
      - name: Test PostgreSQL configuration, MQTT QoS 1 and InfluxDB v2
        run: |
          INFLUX_TEST_TOKEN="$(sed -n 's/^INFLUXDB_ADMIN_TOKEN=//p' .env)" \
          POSTGRES_TEST_DSN="postgres://modbus:$(sed -n 's/^POSTGRES_PASSWORD=//p' .env)@127.0.0.1:5432/modbus?sslmode=disable" \
          MQTT_TEST_BROKER=tcp://127.0.0.1:1883 \
          INFLUX_TEST_URL=http://127.0.0.1:8086 \
          INFLUX_TEST_ORG=modbus \
          INFLUX_TEST_BUCKET=telemetry \
          go test ./internal/pipeline ./internal/configstore -run 'TestMQTTSinkQoS1Integration|TestInfluxSinkIntegration|TestPostgresConfigVersionImportAndActivate' -count=1
      - name: Stop integration services
        if: always()
        run: |
          if [ -f .env ]; then docker compose down; fi
