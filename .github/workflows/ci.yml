name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Resolve and record module checksums
        run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./internal/...
