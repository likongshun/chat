name: ${COMPOSE_PROJECT_NAME:-modbus}

services:
  dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: modbus-dashboard:local
    restart: unless-stopped
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      collector:
        condition: service_healthy
    networks:
      - backend

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: modbus-collector:local
    dns:
      - 127.0.0.11
      - 223.5.5.5
    restart: unless-stopped
    init: true
    environment:
      CONFIG_XLSX: /app/configs/modbus_device_config.xlsx
      WAL_DIR: /data/wal
      POLL_WORKERS: ${POLL_WORKERS:-500}
      POLL_TIMEOUT: ${POLL_TIMEOUT:-800ms}
      DLT645_TIMEOUT: ${DLT645_TIMEOUT:-1500ms}
      SCHEDULER_OUTPUT_BUFFER: ${SCHEDULER_OUTPUT_BUFFER:-10000}
      LATEST_CACHE_MAX_POINTS: ${LATEST_CACHE_MAX_POINTS:-1500000}
      WAL_SEGMENT_BYTES: ${WAL_SEGMENT_BYTES:-67108864}
      MAX_WAL_BYTES: ${MAX_WAL_BYTES:-10737418240}
      ACK_RESERVE_BYTES: ${ACK_RESERVE_BYTES:-67108864}
      METRICS_ADDR: ${METRICS_ADDR:-:9090}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://mqtt:1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-modbus-collector}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-modbus/telemetry}
      INFLUXDB_URL: ${INFLUXDB_URL:-http://influxdb:8086}
      INFLUXDB_ORG: ${INFLUXDB_ORG:-modbus}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-${INFLUXDB_ADMIN_TOKEN}}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-modbus}
      POSTGRES_USER: ${POSTGRES_USER:-modbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      CONFIG_IMPORT_ON_START: ${CONFIG_IMPORT_ON_START:-false}
      SINK_TIMEOUT: ${SINK_TIMEOUT:-10s}
      DELIVERY_BATCH_SIZE: ${DELIVERY_BATCH_SIZE:-500}
      DELIVERY_POLL_INTERVAL: ${DELIVERY_POLL_INTERVAL:-1s}
      DELIVERY_RETRY_INTERVAL: ${DELIVERY_RETRY_INTERVAL:-1s}
    volumes:
      - collector_wal:/data/wal
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/healthz >/dev/null"]
      interval: 15s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      influxdb:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modbus}
      POSTGRES_USER: ${POSTGRES_USER:-modbus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "127.0.0.1:1883:1883"
    networks:
      - backend

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:?Set INFLUXDB_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-modbus}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:?Set INFLUXDB_ADMIN_TOKEN in .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    ports:
      - "127.0.0.1:8086:8086"
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  collector_wal:
  postgres_data:
  mqtt_data:
  mqtt_log:
  influxdb_data:
  influxdb_config:
